name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t skypacs-app:latest .

      - name: Push Image to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag skypacs-app:latest ${{ secrets.DOCKER_USERNAME }}/skypacs-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/skypacs-app:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/skypacs-app:latest
            
            # Determine active deployment
            if [ -f ~/deployments/blue/active ]; then
              NEW_DEPLOYMENT="green"
              OLD_DEPLOYMENT="blue"
              NEW_PORT=5002
            else
              NEW_DEPLOYMENT="blue"
              OLD_DEPLOYMENT="green"
              NEW_PORT=5001
            fi
            
            # Run new deployment
            docker run -d --name skypacs-$NEW_DEPLOYMENT -p $NEW_PORT:5000 --restart unless-stopped ${{ secrets.DOCKER_USERNAME }}/skypacs-app:latest
            
            # Health check
            sleep 10
            if curl -f http://localhost:$NEW_PORT; then
              echo "New deployment is healthy. Switching traffic..."
              rm -f ~/deployments/$OLD_DEPLOYMENT/active
              touch ~/deployments/$NEW_DEPLOYMENT/active
              docker stop skypacs-$OLD_DEPLOYMENT
              docker rm skypacs-$OLD_DEPLOYMENT
              echo "Traffic switched successfully."
            else
              echo "Health check failed. Reverting..."
              docker stop skypacs-$NEW_DEPLOYMENT
              docker rm skypacs-$NEW_DEPLOYMENT
              exit 1
            fi
