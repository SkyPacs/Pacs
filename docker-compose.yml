version: '3.8'

services:
  client:
    container_name: client
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      - pacs
    depends_on:
      - api

  api:
    container_name: api
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb+srv://debashispani61:Skull%403434@cluster0.mmncbxr.mongodb.net/CustomPACS?retryWrites=true
      - JWT_SECRET=ifabiaviabfi73828g
      - PORT=5000
      - ORTHANC_URL=http://orthanc:8042
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    networks:
      - pacs
    depends_on:
      - orthanc

  orthanc:
    container_name: orthanc
    image: jodogne/orthanc-plugins:latest  
    ports:
      - "8042:8042"  
      - "4242:4242"  
    volumes:
      - orthanc_data:/var/lib/orthanc/db 
      - /home/aarush/Pacs/orthanc_config.json:/etc/orthanc/orthanc.json
    restart: unless-stopped
    networks:
      - pacs

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=12345678
    command: server /data --console-address ":9001"
    networks:
      - pacs
    restart: unless-stopped

volumes:
  orthanc_data:
  minio-data:

networks:
  pacs:
    driver: bridge
